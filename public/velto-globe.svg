<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1e9df" />
      <stop offset="0.5" stop-color="#bfb3a5" />
      <stop offset="1" stop-color="#7d7266" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>

    <!-- Longitude rings (meridians) -->
    <g id="meridians" fill="none">
      <circle cx="100" cy="100" r="80" />
      <ellipse cx="100" cy="100" rx="77.3" ry="80" />
      <ellipse cx="100" cy="100" rx="56.6" ry="80" />
      <ellipse cx="100" cy="100" rx="20.7" ry="80" />
    </g>

    <!-- Latitude rings (parallels), seen from slightly above -->
    <g id="parallels" fill="none">
      <ellipse cx="100" cy="30.7" rx="40" ry="8" />
      <ellipse cx="100" cy="60" rx="69.3" ry="13.9" />
      <ellipse cx="100" cy="100" rx="80" ry="16" />
      <ellipse cx="100" cy="140" rx="69.3" ry="13.9" />
      <ellipse cx="100" cy="169.3" rx="40" ry="8" />
    </g>
  </defs>

  <g id="globe" filter="url(#shadow)" transform="rotate(-18 100 100)">
    <!-- Dark underlay gives the rings a tube-like depth -->
    <g stroke="#4a4239" stroke-width="5" opacity="0.8">
      <use href="#meridians" />
      <use href="#parallels" />
    </g>
    <!-- Metallic top layer -->
    <g stroke="url(#metal)" stroke-width="3">
      <use href="#meridians" />
      <use href="#parallels" />
    </g>
  </g>
</svg>